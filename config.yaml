# Video-to-Text default configuration
# Override via .env (secrets) or CLI flags.

# Audio extraction settings
audio:
  sample_rate: 16000
  channels: 1

# ASR (speech-to-text) settings
asr:
  engine: faster-whisper     # "faster-whisper" (本地) | "dashscope" (云端, key 已失效)
  model_size: small          # tiny | base | small | medium (only for faster-whisper)
  device: cuda
  compute_type: float16      # float16 | int8_float16 (use int8 if VRAM tight)
  language: zh               # null = auto-detect; or "zh", "en", "ja", etc.
  beam_size: 5
  vad_filter: true
  word_timestamps: true
  fix_errors: true           # post-process with LLM to fix homophone errors
  dashscope_model: paraformer-v2  # DashScope ASR model: paraformer-v2 | paraformer-8k-v2

# Keyframe extraction
keyframe:
  mode: interval            # "interval" / "scene" / "smart" (text-change-aware)
  interval_sec: 5.0         # for "interval" mode: seconds between frames
  scene_threshold: 0.5      # for "scene" mode: 0.1 (sensitive) ~ 0.5 (strict)
  format: jpg
  quality: 90
  max_keyframes: 500

# OCR settings
ocr:
  engine: easyocr            # "easyocr" (local) | "mote_sense" (remote GPU via mote-home)
  lang: ch_sim,en           # EasyOCR: "ch_sim" = Simplified Chinese, "en" = English
  use_gpu: false            # false = CPU (avoids VRAM conflict with Whisper)
  conf_threshold: 0.5
  mote_sense_url: http://100.118.10.0:3800/ingest  # only used when engine=mote_sense

# Vision / scene description
vision:
  provider: ollama          # dashscope | gemini | deepseek | anthropic | openai | ollama
  model: qwen3.5:397b       # ollama vision model (flash 不支持图片输入)
  max_tokens: 400
  temperature: 0.3
  batch_size: 1

# Ollama cloud (OpenAI-compatible API)
ollama:
  base_url: https://ollama.com/v1
  model: deepseek-v4-flash:0731   # text tasks: ASR 纠错 / 内容分类
  vision_model: qwen3.5:397b      # vision tasks: 场景描述

# Content analysis — auto-detect video type and generate dynamic prompts
content_analysis:
  enabled: true
  bilibili:
    enabled: true             # Parse AV/BV number from filename, call B站 API
    api_timeout: 10           # seconds
  local_fallback: true        # If no URL found, sample first 60s ASR to classify
  max_segments_preview: 3     # Sample N segments for LLM classification

# Output
output:
  dir: ./outputs
  formats:
    - json
    - markdown
  srt_max_chars_per_line: 42
